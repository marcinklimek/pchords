# Konfiguracja terminala Backdoor
# =================================

terminal:
  # Unikalny identyfikator terminala
  id: "terminal-wejscie-1"
  # Nazwa wyświetlana w logach
  name: "Wejście główne"

server:
  # Adres serwera (IP lub hostname)
  url: "http://192.168.1.100:8080"
  # Timeout dla zapytań (ms)
  timeout_ms: 3000
  # Ile razy ponawiać przy błędzie sieci
  retry_count: 2
  # Czas między próbami (ms)
  retry_delay_ms: 500

display:
  # Tryb pełnoekranowy
  fullscreen: true
  # Tytuł okna (jeśli nie fullscreen)
  window_title: "Backdoor - Terminal"
  # Czas wyświetlania wyniku OK (sek)
  success_timeout_sec: 3
  # Czas wyświetlania błędu (sek)
  error_timeout_sec: 5
  # Czas oczekiwania na powrót do IDLE po błędzie połączenia (sek)
  connection_error_timeout_sec: 5

reader:
  # Minimalny czas między odczytami tej samej karty (ms)
  debounce_ms: 3000
  # Minimalna długość UID karty
  min_uid_length: 8

sounds:
  # Czy odtwarzać dźwięki
  enabled: true
  # Głośność (0-100)
  volume: 80
  # Pliki dźwiękowe
  ok_sound: "./assets/sounds/ok.wav"
  error_sound: "./assets/sounds/error.wav"

# Teksty wyświetlane na ekranach
texts:
  idle: "PRZYŁÓŻ KARTĘ"
  checking: "Sprawdzam..."
  connection_error: "Spróbuj ponownie"
  unknown_card: "Nieznana karta\nZgłoś się do obsługi"
  multisport_notice: "Pamiętaj o karcie Multisport"
