services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pchords-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - pchords-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pchords-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host
    depends_on:
      - backend
    networks:
      - pchords-network

networks:
  pchords-network:
    driver: bridge

volumes:
  frontend_node_modules:
